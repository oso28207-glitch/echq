<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسلسلات تركية مدبلجة - قصة عشق</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-film"></i> مسلسلات مدبلجة
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">الرئيسية</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-center mb-4">🎬 المسلسلات التركية المدبلجة</h1>
        
        <div class="row" id="series-list">
            {% for item in series %}
            <div class="col-6 col-md-3 col-lg-2 mb-3">
                <div class="series-card card h-100" data-url="{{ item.url }}" data-name="{{ item.name }}">
                    <div class="card-body text-center">
                        <i class="bi bi-play-circle-fill display-4 text-danger"></i>
                        <h6 class="card-title mt-2">{{ item.name }}</h6>
                        <span class="badge bg-secondary">{{ item.type }}</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <!-- زر تحميل المزيد -->
        <div class="text-center mt-3">
            <button id="load-more" class="btn btn-outline-danger">تحميل المزيد</button>
        </div>
    </div>

    <!-- نافذة عرض الحلقات -->
    <div class="modal fade" id="episodesModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="episodesModalLabel">حلقات المسلسل</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="episodes-list">
                    <div class="text-center">
                        <div class="spinner-border text-danger" role="status">
                            <span class="visually-hidden">جاري التحميل...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة التقدم -->
    <div class="modal fade" id="progressModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">🔄 جاري المعالجة</h5>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-3" id="progress-status">في انتظار البدء...</div>
                    <div class="progress" style="height: 30px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                             role="progressbar" style="width: 0%;">0%</div>
                    </div>
                    <div class="text-center mt-3">
                        <a id="watch-link" href="#" class="btn btn-success" style="display: none;">
                            <i class="bi bi-eye"></i> مشاهدة الفيديو
                        </a>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-5 py-3 bg-light">
        <p class="mb-0">جميع الحقوق محفوظة &copy; 2026 - موقع قصة عشق الاصلي</p>
        <small class="text-muted">تم تطوير هذا الموقع لأغراض تعليمية</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
