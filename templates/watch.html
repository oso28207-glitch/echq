<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الفيديو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; }
        .video-container { max-width: 800px; margin: 0 auto; padding-top: 20px; }
        video { width: 100%; border-radius: 10px; background: #000; }
        .back-btn { margin-bottom: 20px; }
        .download-btn { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container video-container">
        <a href="/" class="btn btn-outline-light back-btn">
            <i class="bi bi-arrow-right"></i> العودة
        </a>
        
        <div class="card bg-dark text-white">
            <div class="card-body">
                <video controls autoplay>
                    <source src="{{ video_url }}" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>
            <div class="card-footer text-center">
                <a href="{{ video_url }}" class="btn btn-success download-btn" download>
                    <i class="bi bi-download"></i> تحميل الفيديو
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
