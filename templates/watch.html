<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الفيديو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #1a1a2e; }
        .video-container { max-width: 800px; margin: 0 auto; padding-top: 20px; }
        video { width: 100%; border-radius: 10px; background: #000; }
        .back-btn { margin-bottom: 20px; }
        .error-msg { color: #ff6b6b; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container video-container">
        <a href="/" class="btn btn-outline-light back-btn">
            <i class="bi bi-arrow-right"></i> العودة
        </a>
        
        <div class="card bg-dark text-white">
            <div class="card-body">
                {% if video_url %}
                <video controls autoplay>
                    <source src="{{ video_url }}" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
                {% else %}
                <div class="text-center py-5">
                    <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                    <p class="error-msg mt-3">❌ لم يتم العثور على رابط الفيديو</p>
                    <p class="text-muted">يرجى المحاولة مرة أخرى لاحقاً</p>
                    <a href="{{ episode_url }}" target="_blank" class="btn btn-outline-light mt-3">
                        <i class="bi bi-link-45deg"></i> فتح الحلقة في الموقع الأصلي
                    </a>
                </div>
                {% endif %}
            </div>
            <div class="card-footer text-center">
                {% if video_url %}
                <a href="{{ video_url }}" class="btn btn-success" download>
                    <i class="bi bi-download"></i> تحميل الفيديو
                </a>
                {% endif %}
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
