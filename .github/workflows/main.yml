name: استخراج سيرفرات المشاهدة

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:        # للتشغيل اليدوي

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت المتطلبات
        run: pip install -r requirements.txt

      - name: تشغيل سكربت الاستخراج
        run: python extract_servers.py

      - name: رفع الملف الناتج كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: servers-json
          path: servers.json
